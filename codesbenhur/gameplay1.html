<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dark Fantasy Analog Horror</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">

<style>

/* =========================
   RESET
========================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    overflow:hidden;
    background:black;
    font-family:'VT323', monospace;
}

/* =========================
   CENA PRINCIPAL
========================= */

.scene{
    position:relative;
    width:100vw;
    height:100vh;
    overflow:hidden;
    background:#000;
}

/* =========================
   BACKGROUND
========================= */

.background{
    position:absolute;
    inset:0;

    background-image:
        linear-gradient(rgba(0,0,0,0.25), rgba(0,0,0,0.65)),
        url("images/gameplay1.png");

    background-size:cover;
    background-position:center;

    filter:
        brightness(0.55)
        contrast(1.2)
        saturate(0.7);

    transform:scale(1.05);
}

/* =========================
   NÉVOA
========================= */

.fog{
    position:absolute;
    inset:0;

    background:
        radial-gradient(circle at 20% 50%, rgba(255,255,255,0.08), transparent 40%),
        radial-gradient(circle at 80% 40%, rgba(255,255,255,0.05), transparent 35%),
        radial-gradient(circle at 50% 80%, rgba(255,255,255,0.04), transparent 30%);

    animation:fogMove 20s linear infinite;
}

@keyframes fogMove{

    0%{
        transform:translateX(0px);
    }

    50%{
        transform:translateX(-20px);
    }

    100%{
        transform:translateX(0px);
    }

}

/* =========================
   PERSONAGEM
========================= */

.character{

    position:absolute;

    bottom:0;
    left:50%;

    transform:translateX(-50%);

    width:400px;
    height:85%;

    background-image:url("https://pngimg.com/d/soldier_PNG112.png");

    background-size:contain;
    background-repeat:no-repeat;
    background-position:center bottom;

    filter:
        brightness(0.6)
        contrast(1.3)
        drop-shadow(0 0 30px black);

    z-index:5;
}

/* =========================
   LUZ VERMELHA
========================= */

.red-light{

    position:absolute;

    right:18%;
    top:20%;

    width:180px;
    height:180px;

    background:red;

    border-radius:50%;

    filter:blur(80px);

    opacity:0.25;

    animation:pulse 3s infinite;
}

@keyframes pulse{

    0%{
        opacity:0.18;
    }

    50%{
        opacity:0.35;
    }

    100%{
        opacity:0.18;
    }

}

/* =========================
   HUD
========================= */

.hud{

    position:absolute;

    top:30px;
    left:35px;

    z-index:20;

    color:white;

    text-shadow:
        0 0 10px rgba(255,255,255,0.4);
}

.status{
    margin-bottom:18px;
}

.label{
    font-size:30px;
    margin-bottom:5px;
}

/* =========================
   BARRAS
========================= */

.bar{

    width:280px;
    height:18px;

    background:#222;

    border:2px solid #111;

    overflow:hidden;

    box-shadow:
        inset 0 0 10px black,
        0 0 10px rgba(0,0,0,0.6);
}

.fill-health{

    height:100%;
    width:100%;

    background:
        linear-gradient(to right,
        #440000,
        red);

}

.fill-stamina{

    height:100%;
    width:80%;

    background:
        linear-gradient(to right,
        #0d2a00,
        #57ff57);
}

/* =========================
   TEXTO VHS
========================= */

.vhs-time{

    position:absolute;

    bottom:35px;
    left:35px;

    z-index:20;

    color:white;

    font-size:60px;

    letter-spacing:4px;

    text-shadow:
        2px 0 red,
        -2px 0 blue;

    opacity:0.85;
}

/* =========================
   OBJETIVO
========================= */

.objective{

    position:absolute;

    right:40px;
    bottom:35px;

    z-index:20;

    color:white;

    font-size:32px;

    width:300px;

    text-align:right;

    text-shadow:
        0 0 10px rgba(255,255,255,0.25);
}

/* =========================
   VHS NOISE
========================= */

.noise{

    position:absolute;
    inset:0;

    background-image:
        url("https://i.imgur.com/8KrmQ6B.png");

    opacity:0.08;

    mix-blend-mode:screen;

    animation:noiseAnim .18s infinite;

    z-index:50;

    pointer-events:none;
}

@keyframes noiseAnim{

    0%{
        transform:translate(0);
    }

    20%{
        transform:translate(-1px,1px);
    }

    40%{
        transform:translate(1px,-1px);
    }

    60%{
        transform:translate(-2px,0px);
    }

    80%{
        transform:translate(2px,1px);
    }

    100%{
        transform:translate(0);
    }

}

/* =========================
   SCANLINES
========================= */

.scanlines{

    position:absolute;
    inset:0;

    background:
        repeating-linear-gradient(
            to bottom,
            rgba(255,255,255,0.02),
            rgba(255,255,255,0.02) 1px,
            rgba(0,0,0,0.12) 3px
        );

    z-index:40;

    pointer-events:none;
}

/* =========================
   GLITCH
========================= */

.glitch{

    position:absolute;
    inset:0;

    background:transparent;

    z-index:45;

    pointer-events:none;

    animation:glitch 5s infinite;
}

@keyframes glitch{

    0%{
        transform:translate(0);
    }

    92%{
        transform:translate(0);
    }

    93%{
        transform:translate(-4px,2px);
    }

    94%{
        transform:translate(5px,-2px);
    }

    95%{
        transform:translate(-2px,1px);
    }

    96%{
        transform:translate(0);
    }

    100%{
        transform:translate(0);
    }

}

/* =========================
   VHS COLOR SHIFT
========================= */

.rgb{

    position:absolute;
    inset:0;

    box-shadow:
        inset 2px 0 rgba(255,0,0,0.08),
        inset -2px 0 rgba(0,0,255,0.08);

    z-index:30;

    pointer-events:none;
}

/* =========================
   PLAY
========================= */

.play{

    position:absolute;

    left:40px;
    top:140px;

    z-index:20;

    color:white;

    font-size:48px;

    animation:blink 1s infinite;
}

@keyframes blink{

    0%{
        opacity:1;
    }

    50%{
        opacity:.3;
    }

    100%{
        opacity:1;
    }

}

</style>
</head>

<body>

<div class="scene">

    <div class="background"></div>

    <div class="fog"></div>

    <div class="red-light"></div>

    <div class="character"></div>

    <!-- HUD -->

    <div class="hud">

        <div class="status">
            <div class="label">VITALIDADE: 100%</div>

            <div class="bar">
                <div class="fill-health"></div>
            </div>
        </div>

        <div class="status">
            <div class="label">ESTAMINA: 80%</div>

            <div class="bar">
                <div class="fill-stamina"></div>
            </div>
        </div>

    </div>

    <!-- PLAY VHS -->

    <div class="play">
        PLAY ▶
    </div>

    <!-- HORÁRIO -->

    <div class="vhs-time">

        PM --:--:--<br>
        OUT. -- -- ----

    </div>

    <!-- OBJETIVO -->

    <div class="objective">

        OBJETIVO:<br>
        Investigar a Sombra<br>
        na Fazenda (180m)

    </div>

    <!-- VHS EFFECTS -->

    <div class="scanlines"></div>

    <div class="rgb"></div>

    <div class="glitch"></div>

    <div class="noise"></div>

</div>

<script>

/* =========================
   TREMER CÂMERA
========================= */

setInterval(() => {

    const scene = document.querySelector(".scene");

    const x = (Math.random() - 0.5) * 2;
    const y = (Math.random() - 0.5) * 2;

    scene.style.transform =
        `translate(${x}px, ${y}px)`;

}, 80);

/* =========================
   GLITCH RANDOM
========================= */

setInterval(() => {

    document.body.style.filter =
        `contrast(${1 + Math.random() * 0.08})
         brightness(${0.92 + Math.random() * 0.08})`;

}, 120);

/* =========================
   FLASH HORROR
========================= */

setInterval(() => {

    if(Math.random() > 0.96){

        document.body.style.filter =
            "brightness(1.25) contrast(1.5)";

        setTimeout(() => {

            document.body.style.filter =
                "brightness(1) contrast(1)";

        }, 70);

    }

}, 500);

</script>

</body>
</html>
